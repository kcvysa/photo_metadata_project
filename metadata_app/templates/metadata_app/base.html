<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Метаданные фотографий{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f8fa; }
        .navbar-brand { font-weight: 600; letter-spacing: .3px; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-radius: .75rem; }
        .card-header { background: #fff; border-bottom: 1px solid #eef0f3; font-weight: 600; }
        .page-title { font-weight: 700; letter-spacing: -.3px; }
        .badge-format { text-transform: uppercase; letter-spacing: .5px; }
        table td, table th { vertical-align: middle; }
        .messages .alert { border-radius: .6rem; }
        code { background: #f1f3f5; padding: .1rem .35rem; border-radius: .25rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'metadata_app:index' %}">📷 Photo Metadata</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'metadata_app:index' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'metadata_app:add' %}">Добавить</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'metadata_app:upload' %}">Загрузить</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'metadata_app:files' %}">Файлы</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">

    {% if messages %}
        <div class="messages mb-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small pb-4">
    Django · JSON · Photo Metadata
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
